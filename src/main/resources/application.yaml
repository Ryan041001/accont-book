spring:
  application:
    name: accont-book

  # MySQL DataSource
  datasource:
    url: jdbc:mysql://localhost:3306/accont_book?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: accont
    password: accont123
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis Configuration
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.shenzhewei.accont_book.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Server Configuration
server:
  port: 8080

# Logging
logging:
  level:
    com.shenzhewei.accont_book: debug
    com.shenzhewei.accont_book.repository: debug
  charset:
    console: UTF-8
    file: UTF-8

# DeepSeek AI Configuration
deepseek:
  api:
    key: your-deepseek-api-key
    base-url: https://api.deepseek.com/v1
    model: deepseek-chat
    timeout: 60000
